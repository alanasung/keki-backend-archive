name: CI

on:
  pull_request:
  push:
    branches: [main]

# Supersede stale runs on PR branches; never cancel a main run — deploy.yml
# checks for a successful CI run on the tagged commit, so a cancelled main
# run would block a later tag on that commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Shared by every step, not only the `webServer` Playwright spawns for e2e:
# `next build` (the "build" step below) imports `@keki/auth` and
# `@keki/database`, both of which validate their configuration eagerly at
# module load (see packages/auth/src/env.ts and packages/database/src/env.ts).
# Supplying these only to Playwright would make the build step fail before
# e2e ever starts — see the WS-12 spec's implementation step 8.
#
# DATABASE_URL_POOLED / DATABASE_URL_DIRECT are not set here: they depend on
# the Neon branch created mid-job (see the "Create Neon test branch" step),
# and a job-level `env:` block cannot reference a step's outputs. They're
# exported to $GITHUB_ENV instead, right after that step, which makes them
# visible to every step from that point on exactly as if they had been
# declared here.
env:
  NODE_ENV: test
  COGNITO_ISSUER: https://localhost:3001
  COGNITO_JWKS_URI: https://localhost:3001/.well-known/jwks.json
  COGNITO_USER_POOL_ID: us-west-2_e2eTestPool
  COGNITO_CLIENT_ID: e2e-test-client-id
  AWS_REGION: us-west-2
  KIOSK_DEVICE_TOKEN: e2e-test-kiosk-device-token

jobs:
  ci:
    runs-on: ubuntu-latest
    # GitHub's default job timeout is 6 hours. Nothing here legitimately runs
    # for more than a few minutes, so a hung network step (an apt mirror that
    # never answers, a dev server that never binds) would otherwise burn
    # hours of runner time before failing. 30 minutes is well clear of a slow
    # but healthy run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Read Node version
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A dedicated branch per run, not the development branch: concurrent
      # runs against one shared branch would corrupt each other, and
      # play_pass_ledger's append-only trigger makes cleanup of a shared
      # branch awkward (see AGENTS.md "Data access" and the WS-12 spec's
      # implementation step 9). Requires the `NEON_API_KEY` and
      # `NEON_PROJECT_ID` repository secrets; see docs/testing.md.
      - name: Create Neon test branch
        id: neon-branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          api_key: ${{ secrets.NEON_API_KEY }}

      # `create-branch-action` collapses an API rejection into a bare
      # "Failed to create branch. AggregateError" and discards the response
      # body, which is unactionable — it cannot be told apart from a quota
      # refusal, a permission change, or a bad project id. This re-asks the
      # API directly and prints what it actually says. Runs only when the step
      # above failed, so healthy runs are untouched.
      #
      # Values rendered as `***` are GitHub masking a secret, not empty
      # fields. The final POST creates a real branch if the API is in fact
      # willing; it is named `ci-*` so cleanup-neon-branches.yml sweeps it
      # within 24 hours, since this run's delete step has no branch_id to
      # work from.
      - name: Diagnose Neon branch creation failure
        if: failure() && steps.neon-branch.outcome == 'failure'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          base="https://console.neon.tech/api/v2"
          auth="Authorization: Bearer $NEON_API_KEY"
          body=/tmp/neon-body.json

          # No `-f`: a non-2xx body is exactly what this step exists to show.
          show() {
            echo "HTTP $1"
            jq . "$body" 2>/dev/null || cat "$body"
            echo
          }

          # Can the key see anything at all, and which org does it belong to?
          echo "--- GET /projects"
          show "$(curl -s -o "$body" -w '%{http_code}' -H "$auth" "$base/projects")"

          # Does the project this repo points at exist, and what are its
          # limits and consumption to date?
          echo "--- GET /projects/<id>"
          show "$(curl -s -o "$body" -w '%{http_code}' -H "$auth" "$base/projects/$NEON_PROJECT_ID")"

          # How many branches already exist, against the plan's cap?
          echo "--- GET /projects/<id>/branches"
          show "$(curl -s -o "$body" -w '%{http_code}' -H "$auth" "$base/projects/$NEON_PROJECT_ID/branches")"

          # And the actual refusal, with its message intact.
          echo "--- POST /projects/<id>/branches"
          payload='{"branch":{"name":"ci-diagnose-'"$GITHUB_RUN_ID"'"},"endpoints":[{"type":"read_write"}]}'
          show "$(curl -s -o "$body" -w '%{http_code}' -X POST -H "$auth" -H 'Content-Type: application/json' -d "$payload" "$base/projects/$NEON_PROJECT_ID/branches")"

      - name: Export database URLs
        run: |
          echo "DATABASE_URL_POOLED=${{ steps.neon-branch.outputs.db_url_pooled }}" >> "$GITHUB_ENV"
          echo "DATABASE_URL_DIRECT=${{ steps.neon-branch.outputs.db_url }}" >> "$GITHUB_ENV"

      - name: Run database migrations
        run: pnpm db:migrate

      # These four must stay byte-for-byte identical to pipeline.config.json's
      # `verify` block, so CI and the pipeline runner agree on what "passing"
      # means (WS-12 spec acceptance criterion 6).
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      # `pnpm test`, not `pnpm -r test`: the root script pins
      # --workspace-concurrency=1. Every integration suite in this repo shares
      # the one Neon branch created above and wipes its tables in `beforeEach`,
      # so packages running concurrently (the .npmrc default is 4) delete each
      # other's rows mid-test. That surfaced as unrelated-looking failures —
      # a notification_outbox row vanishing, catalog-core inserts rejected —
      # rather than anything wrong with the code under test.
      - run: pnpm test
      - run: pnpm -r build

      # WS-12: `pnpm -r test` (above) is what actually gates CI, but it runs
      # every package's `test` script independently and produces no combined
      # report the next step could inspect. `vitest.workspace.ts` already
      # exists for exactly this — "local convenience and coverage
      # aggregation" — so it is reused here to produce one JSON report
      # covering every `integration:` suite in the repo. This re-runs the
      # suite a second time rather than parsing `pnpm -r test`'s per-package
      # output; the tests are deterministic and the redundancy is what keeps
      # this step decoupled from the exact shape of `pnpm -r`'s own output.
      # --no-file-parallelism for the same reason `pnpm test` above pins
      # workspace concurrency to 1: this runs every workspace project in one
      # vitest process, which parallelizes test files across projects by
      # default and would put the integration suites back to wiping each
      # other's rows on the shared Neon branch.
      - name: Generate consolidated Vitest report
        run: pnpm exec vitest run --no-file-parallelism --reporter=json --outputFile=vitest-report.json

      # Fails loudly when any `integration:` suite reports zero executed
      # tests, or when one of the four suites this program's risk register
      # names (capacity concurrency, schema constraints, webhook
      # idempotency, catalog sync) is absent entirely — see
      # scripts/assert-integration-tests-ran.ts. Runs here, in the job that
      # provisioned the Neon branch above, so DATABASE_URL_POOLED/DIRECT are
      # already in scope and those suites are expected to have actually run.
      - name: Audit integration test coverage
        run: pnpm exec tsx scripts/assert-integration-tests-ran.ts vitest-report.json

      # Keyed on the lockfile: the browser build is pinned by the
      # @playwright/test version resolved there. The install below is still
      # run on a cache hit — it no-ops the download and just verifies the
      # browser is present.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Deliberately NOT `--with-deps`: that switches to root and runs
      # `apt-get update && apt-get install` for Chromium's shared libraries,
      # which the `ubuntu-latest` image already ships. It bought nothing and
      # cost the job everything the one time Azure's Ubuntu mirrors stopped
      # answering — apt retried until the run was cancelled. The browser
      # binary itself still has to be downloaded; the e2e suite drives a real
      # Chromium.
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Run e2e tests
        run: pnpm test:e2e

      # WS-12 SC-20's sandbox-fulfillment.spec.ts uses the real Square client
      # and a deployed webhook endpoint, so it is gated on SQUARE_ACCESS_TOKEN
      # and self-skips without it (see that file). This repository does not
      # set SQUARE_ACCESS_TOKEN as a CI secret — no deployed stage exists for
      # pull-request CI to target (docs/testing.md "Deployed-stage tests") —
      # so it is always expected to skip here. This step exists so that
      # absence reads as "acknowledged and skipped" in the run summary rather
      # than looking like nothing was ever supposed to run.
      - name: Report Square sandbox fulfillment test coverage
        if: always()
        run: |
          {
            echo "### Square sandbox fulfillment test (SC-20)";
            if [ -z "${SQUARE_ACCESS_TOKEN:-}" ]; then
              echo "Skipped — \`SQUARE_ACCESS_TOKEN\` is not set in CI. This does not fail the build. Run " \
                   "\`sandbox-fulfillment.spec.ts\` manually before a production release — see " \
                   "\`docs/testing.md\` \"Deployed-stage tests\".";
            else
              echo "\`SQUARE_ACCESS_TOKEN\` is set — \`sandbox-fulfillment.spec.ts\` ran as part of the e2e step above.";
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Delete Neon test branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_id: ${{ steps.neon-branch.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
